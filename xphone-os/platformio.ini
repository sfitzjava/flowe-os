; xphone-os — Xteink X3/X4 (ESP32-C3), ONE universal image.
;
; Every env builds the same dual-profile binary; the running firmware picks
; UC8253 792x528 (X3) vs SSD1677 800x480 (X4) at boot via
; freeink::selectXteinkDevice() (I2C fingerprint — see main.cpp stage 2).
; Why: per-device bins bricked testers in the field — both release zips ship
; a file named update.bin, and the wrong one inits the wrong panel controller
; (frozen screen, dead-looking buttons). x3/x4 env names remain as aliases.

[platformio]
default_envs = x3

[base]
; Same pioarduino platform/toolchain as x4-os (x4-os/platformio.ini [base]).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; M2.1c: -flto below only reaches CCFLAGS; this script adds it to LINKFLAGS
; so ld loads the LTO plugin (see tools/lto_link.py).
; patch_ble_service_friend: one friend line into the pinned framework's
; BLEService.h so CompanionBleService can free the service object BLEServer
; orphans at deinit (upstream has no ~BLEServer). See the script docstring.
extra_scripts =
  pre:tools/gen_version.py
  pre:tools/patch_ble_service_friend.py
  pre:tools/patch_ble_shutdown.py
  pre:tools/patch_webserver_upload.py
  pre:tools/patch_webserver_raw.py
  pre:tools/patch_network_read_buffer.py
  pre:tools/patch_webserver_sync.py
  post:tools/lto_link.py

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Reserve the multipart buffer before the session heap fragments. Phone
  ; and browser uploads have one file part and use query-string options.
  -DFLOWE_WEBSERVER_RESERVED_UPLOAD=1
  -DFLOWE_RAW_UPLOAD=1
  -DWEBSERVER_MAX_POST_ARGS=4
  ; Single framebuffer (~52KB X3 / 48KB X4) — the panel RAM holds the prior frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_FB_RELEASABLE=1
  -DFLOWE_SYNC_CONTROL=1
  ; expat (vendored lib/expat, for the EPUB engine) — the exact expat flags
  ; x4-os [base] uses, so the parser compiles identically: general entities
  ; disabled (security/size), 1KB error-context window. The vendored xmlparse.c
  ; is pre-patched upstream-side (entropy #error commented out), so no
  ; XML_POOR_ENTROPY/HAVE_* entropy defines are needed.
  ; https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  ; PNGdec (vendored lib/PNGdec, R2a cover thumbnails) — same value as x4-os
  ; [base]: room for two filtered RGBA scanlines up to 2048px wide inside the
  ; decoder struct (the default (320*4+1)*2 rejects typical cover widths).
  -DPNG_MAX_BUFFERED_PIXELS=16416
  ; Arduino's network event task lives for ever once Wi-Fi has been up
  ; (no teardown in the framework); it used ~600 B of its 4 KB stack after
  ; a 5 MB transfer (HWM 3496, X4 2026-09-04). Half is plenty and is 2 KB
  ; less residue after the no-restart transfer exit.
  -DARDUINO_NETWORK_EVENT_TASK_STACK_SIZE=2048
  ; SdFat: accept UTF-8 long filenames (guarded default is 0). Without this,
  ; open(O_CREAT)/open() reject any non-ASCII name at the filesystem layer —
  ; "Los hermanos Karamázov….epub" failed to upload, and the same book copied
  ; onto the SD another way can't be opened, so the reader grid calls it
  ; "unreadable". CrossPoint ships with UTF-8 names on; match it.
  -DUSE_UTF8_LONG_NAMES=1
  ; SdFat skips its own `File` typedef whenever the platform provides Arduino
  ; FS.h (always, on ESP32) to avoid colliding with fs::File, and #warns about
  ; it per TU (SdFat.h:461). Nothing here uses SdFat's File (SDCardManager
  ; returns FsFile; DownloadRange.h's File is a template param), so acknowledge
  ; via SdFat's own upstream switch — no behavior change, no -Wno-cpp blanket.
  -DDISABLE_FS_H_WARNING=1
  -std=gnu++2a
  -fno-exceptions
  -flto

build_unflags =
  -std=gnu++11
  -fexceptions

; SDK is vendored at ../freeink-sdk (FreeInk SDK, MIT — hardware/display
; libs only; see its LICENSE/NOTICE).
; EInkDisplay's only dependency is BoardConfig (FreeInkDisplay.h includes it).
; SDCardManager backs the SD firmware self-update (src/SdUpdate.cpp); its
; library.json pulls greiman/SdFat ^2.3.1 from the registry automatically.
; InputManager reads the X3/X4 ADC button ladders; BatteryMonitor reads the
; X3 BQ27220 I2C gauge / X4 ADC divider (both SDK libs, BoardConfig-driven).
; M2 adds ArduinoJson (same pin as x4-os [base] lib_deps) for the companion
; card/command JSON protocol. The BLE stack itself needs NO lib_dep: the
; pioarduino Arduino core's built-in BLE library is compiled against NimBLE
; on ESP32-C3 (framework-arduinoespressif32-libs/esp32c3/sdkconfig:
; CONFIG_BT_NIMBLE_ENABLED=y / CONFIG_NIMBLE_ENABLED=y, Bluedroid off), the
; same stack x4-os builds against — no CONFIG_* build_flags are needed
; either, they come from the core's prebuilt sdkconfig.h.
lib_deps =
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://../freeink-sdk/libs/hardware/SDCardManager
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://../freeink-sdk/libs/hardware/BatteryMonitor
  XteinkDetect=symlink://../freeink-sdk/libs/hardware/XteinkDetect
  bblanchon/ArduinoJson @ 7.4.2

; --- Xteink X3 only — UC8253, 792x528 ----------------------------------------
; Alias of [env:xteink] — kept for docs/muscle memory. All envs now build
; the SAME dual-profile universal image (detection picks at boot).
[env:x3]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  ; X3 battery is a BQ27220 I2C fuel gauge (BoardConfig XTEINK_X3.batteryGauge,
  ; SDA20/SCL0) — compile the gauge backend in (BatteryMonitor.cpp:14).
  -DFREEINK_BATTERY_I2C_GAUGE=1

; --- Xteink X4 only — SSD1677, 800x480 ---------------------------------------
; Universal image: both BoardProfiles compiled in, panel/battery picked at boot
; by freeink::selectXteinkDevice() (mirrors x4-os, which ships one binary).
; This is what releases ship as update.bin — a wrong per-device image on the
; other device inits the wrong panel controller and looks bricked.
[env:xteink]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1

; Alias of [env:xteink] — kept for docs/muscle memory. All envs now build
; the SAME dual-profile universal image (detection picks at boot).
[env:x4]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1

; --- reTerminal Sticky — ESP32-S3R8, SSD1677 800x480 + GT911 touch -----------
; Separate S3 base: different MCU family from the C3 X3/X4 image (BoardConfig.h
; forbids mixing families in one binary). Single-device build — DEFAULT_DEVICE
; becomes STICKY, so no runtime detection runs (main.cpp stage 2 gates it).
[base-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1          ; S3R8: 8 MB octal PSRAM, 32 MB flash variant below
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM (S3R8)
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_upload.offset_address = 0x10000
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_build.partitions = partitions-sticky.csv

extra_scripts =
  pre:tools/gen_version.py
  pre:tools/patch_ble_service_friend.py
  pre:tools/patch_ble_shutdown.py
  pre:tools/patch_webserver_upload.py
  pre:tools/patch_webserver_raw.py
  pre:tools/patch_network_read_buffer.py
  pre:tools/patch_webserver_sync.py
  post:tools/lto_link.py

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1        ; S3 native USB OTG CDC (replaces C3 USB Serial/JTAG)
  ; Reserve the multipart buffer before the session heap fragments. Phone
  ; and browser uploads have one file part and use query-string options.
  -DFLOWE_WEBSERVER_RESERVED_UPLOAD=1
  -DFLOWE_RAW_UPLOAD=1
  -DWEBSERVER_MAX_POST_ARGS=4
  ; Single framebuffer (~52KB X3 / 48KB X4) — the panel RAM holds the prior frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_FB_RELEASABLE=1
  -DFLOWE_SYNC_CONTROL=1
  ; expat (vendored lib/expat, for the EPUB engine) — the exact expat flags
  ; x4-os [base] uses, so the parser compiles identically: general entities
  ; disabled (security/size), 1KB error-context window. The vendored xmlparse.c
  ; is pre-patched upstream-side (entropy #error commented out), so no
  ; XML_POOR_ENTROPY/HAVE_* entropy defines are needed.
  ; https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  ; PNGdec (vendored lib/PNGdec, R2a cover thumbnails) — same value as x4-os
  ; [base]: room for two filtered RGBA scanlines up to 2048px wide inside the
  ; decoder struct (the default (320*4+1)*2 rejects typical cover widths).
  -DPNG_MAX_BUFFERED_PIXELS=16416
  ; Arduino's network event task lives for ever once Wi-Fi has been up
  ; (no teardown in the framework); it used ~600 B of its 4 KB stack after
  ; a 5 MB transfer (HWM 3496, X4 2026-09-04). Half is plenty and is 2 KB
  ; less residue after the no-restart transfer exit.
  -DARDUINO_NETWORK_EVENT_TASK_STACK_SIZE=2048
  ; SdFat: accept UTF-8 long filenames (guarded default is 0). Without this,
  ; open(O_CREAT)/open() reject any non-ASCII name at the filesystem layer —
  ; "Los hermanos Karamázov….epub" failed to upload, and the same book copied
  ; onto the SD another way can't be opened, so the reader grid calls it
  ; "unreadable". CrossPoint ships with UTF-8 names on; match it.
  -DUSE_UTF8_LONG_NAMES=1
  -DFREEINK_DEVICE_STICKY=1          ; the only device in this build
  -DXP_BATT_DESIGN_MAH=750           ; Sticky pack is 750 mAh, not the X3's 650
  ; JPEGDEC: the vendored lib auto-enables the ESP32-S3 SIMD path when it finds
  ; the ESP-DSP header (dsps_fft2r_platform.h, aes3 enabled on S3) but the S3
  ; assembly implementations (s3_ycbcr_convert_*) are not vendored, so the link
  ; fails. The C3 build never hits this (no aes3). Disable SIMD for the port.
  -DNO_SIMD=1
  ; SdFat skips its own `File` typedef whenever the platform provides Arduino
  ; FS.h (always, on ESP32) to avoid colliding with fs::File, and #warns about
  ; it per TU (SdFat.h:461). Nothing here uses SdFat's File (SDCardManager
  ; returns FsFile; DownloadRange.h's File is a template param), so acknowledge
  ; via SdFat's own upstream switch — no behavior change, no -Wno-cpp blanket.
  -DDISABLE_FS_H_WARNING=1
  -std=gnu++2a
  -fno-exceptions
  -flto

build_unflags =
  -std=gnu++11
  -fexceptions

lib_deps =
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://../freeink-sdk/libs/hardware/SDCardManager
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://../freeink-sdk/libs/hardware/BatteryMonitor
  bblanchon/ArduinoJson @ 7.4.2
  ; NOTE: XteinkDetect is deliberately NOT linked — it is Xteink-only (§2).

[env:sticky]
extends = base-s3

; --- Modem-sleep experiment (docs/plans/2026-08-31-modem-sleep-libs.md) ------
; Same universal image, but the prebuilt IDF libraries are a local rebuild
; with BLE controller modem sleep ON (MODE_1, main-XTAL low-power clock).
; The stock envs above keep the official package; rollback = flash x3 again.
; The custom package lives OUTSIDE the repo (a ~500 MB toolchain artifact):
;   ~/Projects/toolchains/esp32-arduino-libs-custom
; Build it with ~/Projects/toolchains/esp32-arduino-lib-builder (pins in
; the plan doc), then: pio run -e x3sleep -t upload.
[env:x3sleep]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_BATTERY_I2C_GAUGE=1
platform_packages =
  espressif/framework-arduinoespressif32-libs @ symlink:///Users/andrewjiang/Projects/toolchains/esp32-arduino-libs-custom

; Lean-BLE variant of x3sleep: the same nap + power-management libraries,
; rebuilt with the radio's buffers sized for one phone
; (docs/plans/2026-09-02-ble-lean-libs.md). Separate package so rollback
; to x3sleep is one flash.
[env:x3lean]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_BATTERY_I2C_GAUGE=1
platform_packages =
  espressif/framework-arduinoespressif32-libs @ symlink:///Users/andrewjiang/Projects/toolchains/esp32-arduino-libs-lean

; Light-sleep variant: the lean package plus tickless idle, main XTAL
; kept powered in light sleep, radio baseband power-down
; (docs/plans/2026-09-02-efficiency-audit.md). The app must still call
; esp_pm_configure with light_sleep_enable and hold the guards listed
; there. Experimental. Not release cargo.
[env:x3ls]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_BATTERY_I2C_GAUGE=1
  -DXP_LIGHT_SLEEP_LIBS=1
platform_packages =
  espressif/framework-arduinoespressif32-libs @ symlink:///Users/andrewjiang/Projects/toolchains/esp32-arduino-libs-ls

; Memory-rebuild variant of x3ls: same light-sleep package plus the audit's
; library-side items (unused library code out of RAM, two system task
; stacks trimmed). Soaks on the X4 first (2026-09-03).
[env:x3mem]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_BATTERY_I2C_GAUGE=1
  -DXP_LIGHT_SLEEP_LIBS=1
platform_packages =
  espressif/framework-arduinoespressif32-libs @ symlink:///Users/andrewjiang/Projects/toolchains/esp32-arduino-libs-mem
