; Explicit X4 experiment. Standard platformio.ini has no local SDK dependency.
; FLOWE_SYNC_SDK must name the measured large-window package, or an exact copy.
; Select with: pio run --project-conf platformio-sync-fast.ini -e x4syncfast
[platformio]
extra_configs = platformio.ini
default_envs = x4syncfast

[env:x4syncfast]
extends = env:x4
build_flags =
  ${env:x4.build_flags}
  -DFLOWE_SYNC_FAST_SDK=1
extra_scripts =
  ${base.extra_scripts}
  pre:tools/verify_sync_sdk.py
platform_packages =
  espressif/framework-arduinoespressif32-libs @ symlink://${sysenv.FLOWE_SYNC_SDK}
